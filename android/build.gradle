allprojects {
    repositories {
        google()
        mavenCentral()
    }

    subprojects {
        afterEvaluate { project ->
            if (project.hasProperty('android')) {
                project.android {
                    if (namespace == null) {
                        namespace project.group
                    }

                    compileOptions {
                        sourceCompatibility JavaVersion.VERSION_17
                        targetCompatibility JavaVersion.VERSION_17
                    }
                }
            }
        }
    }

    tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
        kotlinOptions {
            jvmTarget = "17"
        }
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(':app')
}
// flutter_avif_android 3.1.0 ships the same plugin class in .kt and .java,
// and Flutter now compiles both (https://github.com/yekeskin/flutter_avif/issues/97).
subprojects {
    if (name == 'flutter_avif_android' &&
            file('src/main/java/com/teknorota/flutter_avif/FlutterAvifPlugin.java').exists()) {
        tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
            exclude '**/FlutterAvifPlugin.kt'
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
