on:
  pull_request:
    paths:
      - "DECISION.md"
      - ".github/workflows/decisions.yaml"

name: Decisions

jobs:
  dated_headings:
    name: Every heading is dated
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Find headings without a valid date in their parentheses
        run: |
          failed=0
          while IFS= read -r heading; do
            dates=$(printf '%s\n' "$heading" | grep -oE '\([^()]*\)' | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}' || true)
            valid=${dates:+yes}
            for d in $dates; do
              [ "$(date -d "$d" +%F 2>/dev/null)" = "$d" ] || valid=
            done
            if [ -z "$valid" ]; then
              echo "::error file=DECISION.md::No valid date in the parentheses of: $heading"
              failed=1
            fi
          done < <(grep -E '^#{2,3} ' DECISION.md)
          exit $failed
