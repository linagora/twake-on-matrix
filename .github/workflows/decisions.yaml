on:
  pull_request:
    paths:
      - "DECISION.md"
      - ".github/workflows/decisions.yaml"

name: Decisions

jobs:
  dated_headings:
    name: Every heading is dated
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Find headings without a date
        run: |
          undated=$(grep -nE '^#{2,3} ' DECISION.md | grep -vE '[0-9]{4}-[0-9]{2}-[0-9]{2}' || true)
          if [ -n "$undated" ]; then
            echo "::error file=DECISION.md::Headings without a date:"
            echo "$undated"
            exit 1
          fi
