name: Release macOS to TestFlight

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Ref to build from: main to seed the signing material once, or a release tag cut after the secrets-based lanes merged (the build uses the version of the last reachable tag)"
        required: true
        default: "main"
      seed_match:
        description: "Seed the macOS App Store profile and installer certificate in match first"
        type: boolean
        default: false

env:
  FLUTTER_VERSION: 3.47.8
  XCODE_VERSION: 27.2

jobs:
  release_macos:
    name: Release on macOS
    runs-on: xcode-27
    environment: prod

    env:
      SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
      SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      SENTRY_ENVIRONMENT: ${{ secrets.SENTRY_ENVIRONMENT }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          # last_git_tag and the Sentry release version need the tags.
          fetch-depth: 0

      - name: Require Sentry DSN
        run: test -n "$SENTRY_DSN" || { echo "::error::SENTRY_DSN is empty"; exit 1; }

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:-${{ hashFiles('**/pubspec.lock') }}"

      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: Setup Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: macos

      - name: Select Xcode version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Prepare macOS release
        run: ./scripts/prepare-macos.sh

      # Writes MACOS_CERTIFICATE_P12_BASE64 and MACOS_PROVISIONING_PROFILE_BASE64
      # in the repository secrets; the p12 never leaves the runner. GH_TOKEN is a
      # token scoped to the repository secrets of this repository.
      - name: Seed the match profile and certificate
        if: inputs.seed_match
        env:
          APPLE_CERTIFICATES_SSH_KEY: ${{ secrets.APPLE_CERTIFICATES_SSH_KEY }}
          APPLE_KEY_ID: ${{ secrets.APPLE_KEY_ID }}
          APPLE_ISSUER_ID: ${{ secrets.APPLE_ISSUER_ID }}
          APPLE_KEY_CONTENT: ${{ secrets.APPLE_KEY_CONTENT }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          GH_TOKEN: ${{ secrets.MACOS_SIGNING_SECRETS_TOKEN }}
        run: bundle exec fastlane seed_export
        working-directory: macos

      - name: Check the macOS signing secrets
        id: macos_signing
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.MACOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          if [ -n "$MACOS_CERTIFICATE_P12_BASE64" ] && [ -n "$MACOS_PROVISIONING_PROFILE_BASE64" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      # Without the check a run with missing secrets would end green after
      # uploading nothing; fail like the Sentry DSN check above instead.
      - name: Fail when the signing secrets are missing
        if: ${{ !inputs.seed_match && steps.macos_signing.outputs.available != 'true' }}
        run: |
          echo "::error::MACOS_CERTIFICATE_P12_BASE64 and MACOS_PROVISIONING_PROFILE_BASE64 are required: run this workflow once with seed_match=true to create them."
          exit 1

      - name: Compute Sentry release version
        id: sentry_version
        run: echo "release=$(git describe --tags --abbrev=0 | sed 's/^v//')" >> "$GITHUB_OUTPUT"

      - name: Release on TestFlight
        if: steps.macos_signing.outputs.available == 'true'
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.MACOS_PROVISIONING_PROFILE_BASE64 }}
          APPLE_KEY_ID: ${{ secrets.APPLE_KEY_ID }}
          APPLE_ISSUER_ID: ${{ secrets.APPLE_ISSUER_ID }}
          APPLE_KEY_CONTENT: ${{ secrets.APPLE_KEY_CONTENT }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          SENTRY_RELEASE: ${{ steps.sentry_version.outputs.release }}
          FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: 180
        run: ../scripts/release-macos-testflight.sh
        working-directory: macos
