on:
  workflow_dispatch:
    inputs:
      patrol_test_target:
        description: "Path to a Patrol integration test Dart file for a single-target run. Leave empty (default) to run the nightly shard suite."
        required: false
        default: ""
      run_perf:
        description: "Also run the performance jobs (build + physical median). Off by default so a functional dispatch only runs the integration tests."
        required: false
        default: "false"
      publish_perf_history:
        description: "Publish this performance run to Pages. Main uses the canonical history; feat/ftl-performance-pages uses an isolated preview."
        required: false
        type: boolean
        default: false
  schedule:
    - cron: "0 0 * * *"

name: Integration Tests

env:
  FLUTTER_VERSION: "3.38.9"
  JAVA_VERSION: 17
  ANDROID_SDK_ROOT: "/usr/local/lib/android/sdk"
  # FTL_RESULTS_BUCKET cannot be defined here: secrets are not accessible in the
  # workflow-level env block. It is defined at job level in each job that needs it.

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # Job 1a – Single-target functional run on a GitHub-hosted x86_64 emulator.
  # Every FTL virtual Android phone/tablet is ARM and FTL has recurring
  # "execution delay on ARM based virtual devices" incidents; GitHub Linux
  # runners have KVM, so a local x86_64 AVD is faster, cheaper and more stable.
  # Functional only: x86_64 is not representative of real (ARM) devices, so
  # performance stays on physical hardware (job 3).
  # ────────────────────────────────────────────────────────────────────────────
  integration_test:
    name: "Integration Test (x86_64 emulator) — ${{ inputs.patrol_test_target }}"
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.patrol_test_target != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      # Patrol builds a universal APK and compiles the Rust FFI targets. The
      # standard runner only has ~14 GB, so remove toolchains this job never
      # uses before restoring Flutter and Gradle dependencies.
      - name: Free up disk space
        run: |
          echo "Disk space before cleanup:"
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo docker image prune --all --force
          sudo apt-get clean
          echo "Disk space after cleanup:"
          df -h

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: "temurin"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"
          cache: true

      - name: Add Android SDK tools to PATH
        run: echo "${{ env.ANDROID_SDK_ROOT }}/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses || echo "Warning: License acceptance failed"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Rust targets for Android
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android

      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: Setup project
        run: |
          flutter pub get
          flutter pub run build_runner build --delete-conflicting-outputs
          dart pub global activate patrol_cli 4.3.1

      - name: Start Synapse (Docker)
        run: ./scripts/integration-server-synapse.sh

      - name: Provision fixtures for the emulator
        run: |
          SYNAPSE_URL=http://127.0.0.1 SYNAPSE_SERVER_NAME=localhost \
            ./scripts/integration-test-provision-synapse.sh > .env.local
          # The emulator reaches the runner's loopback through the 10.0.2.2
          # alias, so rewrite the connection URLs while keeping the Matrix
          # server name (user IDs stay @user:localhost).
          sed -E 's#^(MATRIX_URL|SERVER_URL)=http://(127\.0\.0\.1|localhost)#\1=http://10.0.2.2#' \
            .env.local > .env.cicd
          # The provision script emits TEST_USERNAME/TEST_PASSWORD (to dodge
          # zsh's read-only USERNAME); the suite reads USERNAME/PASSWORD.
          sed -i -E 's/^TEST_USERNAME=/USERNAME=/; s/^TEST_PASSWORD=/PASSWORD=/' .env.cicd
          cut -d= -f1 .env.cicd

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Patrol on x86_64 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: |
            bash scripts/ci/run-patrol-emulator.sh "${{ inputs.patrol_test_target }}"

      - name: Tear down Synapse
        if: always()
        run: docker rm -f synapse || true

  # ────────────────────────────────────────────────────────────────────────────
  # Job 1b – Nightly functional suite, one shard per parallel x86_64 emulator.
  # Each shard builds its own APK and runs its files in a single Patrol
  # invocation. Jobs are independent: no fail-fast masking, no FTL queue and no
  # ARM incidents. Keep the shard target lists in sync with the historical FTL
  # shards.
  # ────────────────────────────────────────────────────────────────────────────
  integration_shards:
    name: "Integration Test (${{ matrix.shard }})"
    if: ${{ github.event_name == 'schedule' || inputs.patrol_test_target == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read

    defaults:
      run:
        shell: bash

    strategy:
      # One failing shard must not hide the others.
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          # 7 test cases (~15 min)
          - shard: shard_1_chat_group
            targets: integration_test/tests/chat/chat_group_test.dart
          # 4 test cases (~8 min)
          - shard: shard_2_chat_list
            targets: integration_test/tests/chat/chat_list_test.dart
          # 7 repeatable message test cases. transfer_ownership_test is
          # intentionally excluded: it transfers the persistent fixture to a
          # different owner. It stays covered by the web workflow, whose
          # Synapse is disposable.
          - shard: shard_3_chat_messages
            targets: >-
              integration_test/tests/chat/chat_test.dart
              integration_test/tests/chat/forward_message_test.dart
              integration_test/tests/chat/sending_message_test.dart
              integration_test/tests/chat/message_context_menu_safe_area_patrol_test.dart
          # 6 stateful chat flows, isolated from the message scenarios above.
          - shard: shard_4_chat_flows
            targets: >-
              integration_test/tests/chat/chat_dm_leave_test.dart
              integration_test/tests/chat/chat_image_retry_test.dart
              integration_test/tests/chat/chat_group_open_profile_test.dart
              integration_test/tests/chat/create_new_group_chat_test.dart
              integration_test/tests/chat/create_direct_chat_with_unsupported_matrix_user_test.dart
              integration_test/tests/chat/search_external_mxid_test.dart
          # 7 test cases (~15 min). Web-only tests (e.g. web_login_paths_test,
          # which boots web_test_main and expects the web AutoHomeserverPicker
          # flow) must NOT be listed here — they can never pass on Android and
          # are covered by the patrol-web nightly workflow.
          - shard: shard_5_misc
            targets: >-
              integration_test/tests/contact/contact_test.dart
              integration_test/tests/login/login_with_password_test.dart
              integration_test/tests/setting/language_test.dart
              integration_test/tests/setting/settings_contacts_visibility_test.dart
              integration_test/tests/setting/settings_recovery_key_test.dart

    steps:
      - uses: actions/checkout@v4

      # Patrol builds a universal APK and compiles the Rust FFI targets. The
      # standard runner only has ~14 GB, so remove toolchains this job never
      # uses before restoring Flutter and Gradle dependencies.
      - name: Free up disk space
        run: |
          echo "Disk space before cleanup:"
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo docker image prune --all --force
          sudo apt-get clean
          echo "Disk space after cleanup:"
          df -h

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: "temurin"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"
          cache: true

      - name: Add Android SDK tools to PATH
        run: echo "${{ env.ANDROID_SDK_ROOT }}/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses || echo "Warning: License acceptance failed"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Rust targets for Android
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android

      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: Setup project
        run: |
          flutter pub get
          flutter pub run build_runner build --delete-conflicting-outputs
          dart pub global activate patrol_cli 4.3.1

      - name: Start Synapse (Docker)
        run: ./scripts/integration-server-synapse.sh

      - name: Provision fixtures for the emulator
        run: |
          SYNAPSE_URL=http://127.0.0.1 SYNAPSE_SERVER_NAME=localhost \
            ./scripts/integration-test-provision-synapse.sh > .env.local
          # The emulator reaches the runner's loopback through the 10.0.2.2
          # alias, so rewrite the connection URLs while keeping the Matrix
          # server name (user IDs stay @user:localhost).
          sed -E 's#^(MATRIX_URL|SERVER_URL)=http://(127\.0\.0\.1|localhost)#\1=http://10.0.2.2#' \
            .env.local > .env.cicd
          # The provision script emits TEST_USERNAME/TEST_PASSWORD (to dodge
          # zsh's read-only USERNAME); the suite reads USERNAME/PASSWORD.
          sed -i -E 's/^TEST_USERNAME=/USERNAME=/; s/^TEST_PASSWORD=/PASSWORD=/' .env.cicd
          cut -d= -f1 .env.cicd

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Patrol shard on x86_64 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: |
            bash scripts/ci/run-patrol-emulator.sh ${{ matrix.targets }}

      - name: Tear down Synapse
        if: always()
        run: docker rm -f synapse || true

  # ────────────────────────────────────────────────────────────────────────────
  # Job 2 – Build perf APK once, upload as artifact
  # ────────────────────────────────────────────────────────────────────────────
  perf_build:
    name: Build Perf APK
    if: ${{ github.event_name == 'schedule' || inputs.run_perf == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          echo "Disk space before cleanup:"
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo docker image prune --all --force
          sudo apt-get clean
          echo "Disk space after cleanup:"
          df -h

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: "temurin"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"
          cache: true

      - name: Add Android SDK tools to PATH
        run: echo "${{ env.ANDROID_SDK_ROOT }}/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses || echo "Warning: License acceptance failed"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Rust targets for Android
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android

      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: Setup project
        run: flutter pub get && flutter pub run build_runner build --delete-conflicting-outputs

      - name: Build perf test APK
        env:
          INTEGRATION_TEST_ENV_BASE64: ${{ secrets.INTEGRATION_TEST_ENV_BASE64 }}
          ORG_GRADLE_PROJECT_patrolTestBuildType: profile
        run: |
          dart pub global activate patrol_cli 4.3.1
          flutter build apk --config-only

          # The secret may hold either base64-encoded content or the raw env
          # file. Try base64 first (CR/LF/spaces stripped); if that yields
          # env-like `KEY=...` lines use it, otherwise fall back to the raw
          # secret value.
          if printf '%s' "$INTEGRATION_TEST_ENV_BASE64" | tr -d '\r\n ' | base64 -d 2>/dev/null | grep -q '='; then
            printf '%s' "$INTEGRATION_TEST_ENV_BASE64" | tr -d '\r\n ' | base64 -d > .env.cicd
          else
            printf '%s\n' "$INTEGRATION_TEST_ENV_BASE64" > .env.cicd
          fi
          if ! grep -q '=' .env.cicd; then
            echo "::error::INTEGRATION_TEST_ENV_BASE64 is neither valid base64 nor a raw env file."
            exit 1
          fi
          trap 'rm -f .env.cicd' EXIT

          patrol build android \
            -v \
            --profile \
            --no-label \
            --dart-define-from-file .env.cicd \
            --target integration_test/tests/chat/perf_test.dart

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: perf-apks-${{ github.run_id }}
          retention-days: 1
          path: |
            build/app/outputs/apk/profile/app-profile.apk
            build/app/outputs/apk/androidTest/profile/app-profile-androidTest.apk

  # ────────────────────────────────────────────────────────────────────────────
  # Job 3 – All performance metrics: 3 sequential runs on physical hardware.
  # Virtual-device performance is not representative. Serial execution also
  # prevents concurrent Matrix logins with the shared CI account.
  # ────────────────────────────────────────────────────────────────────────────
  perf_run_physical:
    name: Perf Physical Run ${{ matrix.run }}/3
    if: >-
      ${{
        always() && needs.perf_build.result == 'success' &&
        (github.event_name == 'schedule' || inputs.run_perf == 'true')
      }}
    needs: [perf_build, integration_test]
    runs-on: ubuntu-latest
    concurrency:
      group: matrix-ci-shared-account
      queue: max
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
    env:
      FTL_RESULTS_BUCKET: "${{ secrets.GOOGLE_CLOUD_PROJECT_ID }}_test_results"

    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        run: [1, 2, 3]

    defaults:
      run:
        shell: bash

    steps:
      - name: Validate FTL bucket name
        run: |
          if [[ "$FTL_RESULTS_BUCKET" == _* ]]; then
            echo "ERROR: FTL_RESULTS_BUCKET='$FTL_RESULTS_BUCKET' — GOOGLE_CLOUD_PROJECT_ID secret is missing or empty."
            exit 1
          fi

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ secrets.GOOGLE_CLOUD_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GOOGLE_CLOUD_WORKLOAD_IDENTITY_PROVIDER_ID }}
          service_account: ${{ secrets.GOOGLE_CLOUD_SERVICE_ACCOUNT }}

      - name: Download APKs
        uses: actions/download-artifact@v4
        with:
          name: perf-apks-${{ github.run_id }}
          path: apks/

      # upload-artifact@v4 strips the APK paths to their least common ancestor.
      - name: Run perf test on physical device
        run: |
          PERF_RUN_ID="perf-physical-${{ github.run_id }}-run${{ matrix.run }}"
          # Export before FTL so logcat download still works if the test fails.
          echo "PERF_RUN_ID=$PERF_RUN_ID" >> "$GITHUB_ENV"

          gcloud firebase test android run \
            --type instrumentation \
            --app apks/profile/app-profile.apk \
            --test apks/androidTest/profile/app-profile-androidTest.apk \
            --device model=oriole,version=33 \
            --timeout 30m \
            --use-orchestrator \
            --environment-variables clearPackageData=true \
            --results-bucket "$FTL_RESULTS_BUCKET" \
            --results-dir "$PERF_RUN_ID"

      # gcloud storage (not gsutil): gsutil often ignores WIF/ADC and hits 401 Anonymous.
      - name: Download logcat from GCS
        if: always() && env.PERF_RUN_ID != ''
        run: |
          GCS_PATH="gs://$FTL_RESULTS_BUCKET/$PERF_RUN_ID"
          mkdir -p ./perf_gcs_results
          gcloud storage cp -r "${GCS_PATH}/*" ./perf_gcs_results/ \
            || { echo "ERROR: gcloud storage failed to download results from $GCS_PATH"; exit 1; }
          find ./perf_gcs_results -name "logcat" -exec cat {} + > perf_logcat.txt \
            || { echo "ERROR: no logcat file found in GCS results"; exit 1; }
          if [ ! -s perf_logcat.txt ]; then
            echo "ERROR: logcat is empty"; exit 1
          fi

      - name: Upload physical run logcat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-physical-logcat-${{ github.run_id }}-run${{ matrix.run }}
          retention-days: 7
          path: perf_logcat.txt

  # ────────────────────────────────────────────────────────────────────────────
  # Job 4 – Compute a median across the 3 physical runs
  # ────────────────────────────────────────────────────────────────────────────
  perf_median:
    name: Compute Perf Median
    if: ${{ github.event_name == 'schedule' || inputs.run_perf == 'true' }}
    needs: perf_run_physical
    runs-on: ubuntu-latest
    permissions:
      contents: read

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download physical run logcats
        uses: actions/download-artifact@v4
        with:
          pattern: perf-physical-logcat-${{ github.run_id }}-run*
          path: perf_logcats/physical/
          merge-multiple: false

      - name: Compute physical median
        run: |
          mapfile -t LOGCAT_FILES < <(find perf_logcats/physical/ -name "perf_logcat.txt" | sort)
          echo "Physical logcat files: ${LOGCAT_FILES[*]}"

          python3 scripts/perf/compute_median.py \
            --expected-samples 3 \
            --requirements scripts/perf/android_requirements.json \
            "${LOGCAT_FILES[@]}" \
            perf_median_physical.json

          echo "=== Physical Median Results ==="
          cat perf_median_physical.json

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: perf-results-${{ github.run_id }}
          retention-days: 90
          path: perf_median_physical.json

  # ────────────────────────────────────────────────────────────────────────────
  # Job 5 – Append the successful nightly aggregate to the GitHub Pages history
  # ────────────────────────────────────────────────────────────────────────────
  publish_perf_history:
    name: Publish Perf History
    if: >-
      ${{
        (github.ref == 'refs/heads/main' &&
          (github.event_name == 'schedule' ||
            (github.event_name == 'workflow_dispatch' && inputs.publish_perf_history == true))) ||
        (github.ref == 'refs/heads/feat/ftl-performance-pages' &&
          github.event_name == 'workflow_dispatch' &&
          inputs.publish_perf_history == true)
      }}
    needs: perf_median
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: gh-pages-writes
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download consolidated performance results
        uses: actions/download-artifact@v4
        with:
          name: perf-results-${{ github.run_id }}
          path: perf-results/

      - name: Checkout existing GitHub Pages history
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: gh-pages
          path: existing-pages

      - name: Configure publication destination
        id: publication
        run: |
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            echo "directory=performance" >> "$GITHUB_OUTPUT"
            echo "url=https://linagora.github.io/twake-on-matrix/performance/" >> "$GITHUB_OUTPUT"
          else
            echo "directory=performance-previews/feat-ftl-performance-pages" >> "$GITHUB_OUTPUT"
            echo "url=https://linagora.github.io/twake-on-matrix/performance-previews/feat-ftl-performance-pages/" >> "$GITHUB_OUTPUT"
          fi

      - name: Build performance dashboard publication
        env:
          PERF_DASHBOARD_URL: ${{ steps.publication.outputs.url }}
          PERF_HISTORY_DIRECTORY: existing-pages/${{ steps.publication.outputs.directory }}/data
        run: |
          set -euo pipefail
          mkdir -p performance-site/data

          if [ -d "$PERF_HISTORY_DIRECTORY" ]; then
            cp -R "$PERF_HISTORY_DIRECTORY"/. performance-site/data/
          fi
          cp -R scripts/perf/dashboard/. performance-site/

          python3 scripts/perf/version_dashboard_assets.py \
            --index performance-site/index.html \
            --version "$GITHUB_SHA"

          python3 scripts/perf/update_history.py \
            --memory perf-results/perf_median_physical.json \
            --physical perf-results/perf_median_physical.json \
            --benchmark-source physical \
            --physical-runs 3 \
            --data-directory performance-site/data \
            --date "$(date -u +%F)" \
            --generated-at "$(date -u +%FT%TZ)" \
            --repository "$GITHUB_REPOSITORY" \
            --sha "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --flutter-version "$FLUTTER_VERSION" \
            --summary-file performance-summary.md

      - name: Deploy performance dashboard
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: performance-site
          keep_files: true
          destination_dir: ${{ steps.publication.outputs.directory }}
          commit_message: "Publish FTL performance history for ${{ github.sha }}"

      - name: Summarize published performance point
        run: cat performance-summary.md >> "$GITHUB_STEP_SUMMARY"
