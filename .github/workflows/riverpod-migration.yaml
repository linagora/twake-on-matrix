on:
  pull_request:
    branches: [main]

name: Riverpod migration

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ratchet:
    name: Legacy code does not grow
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          # The merge commit and its first parent, the base branch tip.
          fetch-depth: 2
          persist-credentials: false

      - name: Compare with the base branch
        run: |
          set -o pipefail
          scripts/migration_status.sh --check HEAD^1 | tee -a "$GITHUB_STEP_SUMMARY"
