user  nginx;
worker_processes  auto;

# Built in the Dockerfile against this image's nginx; serves the .br twins
# produced at build time. Static only, nothing is compressed on the fly.
load_module modules/ngx_http_brotli_static_module.so;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    # nginx ships no .mjs entry, so ES modules would go out as
    # application/octet-stream and browsers refuse to execute them: the script
    # fails silently and its static imports are never fetched.
    types { text/javascript mjs; }
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;

    keepalive_timeout  65;
    add_header Cache-Control "no-cache";
    etag on;

    server {
      listen 80;

      root /usr/share/nginx/html;

      # Deploy-time injected / version-bearing files are never cached: the app
      # must always get the current homeserver/VAPID config and the current
      # precache manifest (drives the service worker's eviction on each boot).
      # Overrides the http-level `Cache-Control: no-cache` for these URLs only.
      location ~ ^/web/(config\.json|version\.json|assets/sw-manifest\.json)$ {
        add_header Cache-Control "no-store";
      }

      location / {
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
      }

      error_page   500 502 503 504  /50x.html;

      location = /50x.html {
        root   /usr/share/nginx/html;
      }
    }

    gzip_static on;
    brotli_static on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_http_version 1.1;
}